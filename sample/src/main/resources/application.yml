server:
  port: ${SERVER_PORT:6789}
spring:
  profiles:
    active: test
  main:
    allow-bean-definition-overriding: true
  application:
    name: ${APP_NAME:cloud-api-sample}
  datasource:
    druid:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${DB_URL:172.17.0.1:3306}/cloud_sample?useSSL=false&allowPublicKeyRetrieval=true
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:root}
      initial-size: 10
      min-idle: 10
      max-active: 20
      max-wait: 60000
  jpa:
    hibernate:
      ddl-auto: update  # 自动更新表结构
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        globally_quoted_identifiers: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  redis:
    host: ${REDIS_HOST:172.17.0.1}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    username: # if you enable
    password: ${REDIS_PASSWORD:admin}
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

  captcha:
    expire: ${CAPTCHA_EXPIRE:120} # 验证码过期时间（秒）
    width: 120 # 验证码图片宽度
    height: 40 # 验证码图片高度
    fail-limit: 5

rsa:
  key:
    size: 2048

jwt:
  issuer: DJI
  subject: CloudApiSample
  secret: ${JWT_SECRET:CloudApiSample}
  age: 43200

# OIDC client (this service acts as the Relying Party).
# Only the on/off switch lives here. Per-provider configuration (client id/secret, issuer,
# endpoints, keys, ...) is stored in the database (oidc_provider table) and managed through
# the management API: /manage/api/v1/oidc/providers
# Login URLs (provider id appears in the path):
#   /manage/api/v1/login/oidc/{provider}          -> start login
#   /manage/api/v1/login/oidc/{provider}/callback -> callback
oidc:
  enabled: ${OIDC_ENABLED:false}

init:
  database:
    admin-name: ${INIT_DATABASE_ADMIN:adminPC}
    workspace-name: ${INIT_DATABASE_WORKSPACE:Group One}
    bind-code: ${INIT_DATABASE_BIND_CODE:qwe}

mqtt:
  # @see com.dji.sample.component.mqtt.model.MqttUseEnum
  # BASIC parameters are required.
  BASIC:
    protocol: MQTT # @see com.dji.sample.component.mqtt.model.MqttProtocolEnum
    host: ${MQTT_BASIC_HOST:172.17.0.1}
    port: ${MQTT_BASIC_PORT:1883}
    username: ${MQTT_BASIC_USERNAME:JavaServer}
    password: ${MQTT_BASIC_PASSWORD:123456}
    client-id: ${MQTT_BASIC_CLIENT_ID:123456}
    # If the protocol is ws/wss, this value is required.
    path:
  DRC:
    protocol: WS # @see com.dji.sample.component.mqtt.model.MqttProtocolEnum
    host: ${MQTT_DRC_HOST:172.17.0.1}
    port: ${MQTT_DRC_PORT:8083}
    path: /mqtt
    username: ${MQTT_DRC_USERNAME:JavaServer}
    password: ${MQTT_DRC_PASSWORD:123456}

cloud-sdk:
  mqtt:
    # Topics that need to be subscribed when initially connecting to mqtt, multiple topics are divided by ",".
    inbound-topic: sys/product/+/status,thing/product/+/requests

url:
  manage:
    prefix: manage
    version: /api/v1
  map:
    prefix: map
    version: /api/v1
  media:
    prefix: media
    version: /api/v1
  wayline:
    prefix: wayline
    version: /api/v1
  storage:
    prefix: storage
    version: /api/v1
  control:
    prefix: control
    version: /api/v1
  psdk:
    prefix: psdk
    version: /api/v1
  proxy:
    prefix: proxy

proxy:
  emqx:
    url: ${PROXY_EMQX_URL:http://192.168.1.1:800}
    username: ${PROXY_EMQX_USERNAME:admin}
    password: ${PROXY_EMQX_PASSWORD:password}

