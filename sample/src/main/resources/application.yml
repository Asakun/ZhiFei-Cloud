oss:
  enable: true
  provider: minio
  endpoint: ${OSS_ENDPOINT:http://192.168.1.1:9000}
  access-key: ${OSS_ACCESS_KEY:minioadmin}
  secret-key: ${OSS_SECRET_KEY:minioadmin}
  bucket: ${OSS_BUCKET:cloud-bucket}
  expire: 3600
  region: cn-hangzhou
  object-dir-prefix: cloud_api_

logging:
  level:
    com.dji: ${LOG_LEVEL:debug}
  file:
    name: logs/cloud-api-sample.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 100
      file-name-pattern: "${LOG_FILE}.%d{yyyy-MM-dd}.%i.log.gz"

ntp:
  server:
    host: ntp.aliyun.com

# To create a license for an application: https://developer.dji.com/user/apps/#all
cloud-api:
  app:
    id: ${CLOUD_API_APP_ID}
    key: ${CLOUD_API_APP_KEY}
    license: ${CLOUD_API_APP_LICENSE}

livestream:
  url:
    # It is recommended to use a program to create Token. https://github.com/AgoraIO/Tools/blob/master/DynamicKey/AgoraDynamicKey/java/src/main/java/io/agora/media/RtcTokenBuilder2.java
    agora:
      channel: Please enter the agora channel.
      token: Please enter the agora temporary token.
      uid:  654321

    # RTMP  Note: This IP is the address of the streaming server. If you want to see livestream on web page, you need to convert the RTMP stream to WebRTC stream.
    rtmp:
      url: Please enter the rtmp access address.  # Example: 'rtmp://192.168.1.1/live/'
    rtsp:
      username: Please enter the username.
      password: Please enter the password.
      port: 8554

    # GB28181 Note:If you don't know what these parameters mean, you can go to Pilot2 and select the GB28181 page in the cloud platform. Where the parameters same as these parameters.
    gb28181:
      serverIP: Please enter the server ip.
      serverPort: 5060
      apiPort: 18978
      apiKey: wvp api key
      serverID: Please enter the server id.
      agentID: Please enter the agent id.
      agentPassword: Please enter the agent password.
      localPort: 5060
      channel: Please enter the channel.

    # Webrtc: Only supports using whip standard
    whip:
      url: ${LIVESTREAM_WHIP_URL:http://172.17.0.1:1985/rtc/v1/whip/?app=live&stream=}