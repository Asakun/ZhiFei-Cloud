<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
    <linearGradient id="grad1" x1="32" y1="2" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="grad_blue" x1="10" y1="10" x2="54" y2="50" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#2D8CF0" />
        <stop offset="100%" stop-color="#1B5FAD" />
    </linearGradient>
  </defs>
  <!-- Shadow (Ellipse on ground) -->
  <ellipse cx="32" cy="58" rx="10" ry="3" fill="#000000" fill-opacity="0.3" />
  
  <!-- Marker Body -->
  <path d="M32 4 C18.745 4 8 14.745 8 28 C8 42 32 60 32 60 C32 60 56 42 56 28 C56 14.745 45.255 4 32 4Z" fill="url(#grad_blue)" filter="url(#shadow)" stroke="#ffffff" stroke-width="1.5"/>
  
  <!-- Inner Circle -->
  <circle cx="32" cy="28" r="10" fill="white" fill-opacity="0.9"/>
</svg>
