version: "3.8"
networks:
  uav-net:
    name: uav-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
services:
  #################################
  # SRS 流媒体
  #################################
  srs:
    image: ossrs/srs:latest
    container_name: srs
    restart: always
    networks:
      uav-net:
        ipv4_address: 172.19.0.10
    ports:
      - "5003:1935"
      - "5004:1985"
      - "5005:8080"
      - "5006:5006/udp"
    volumes:
      - /data/srs/conf:/usr/local/srs/conf
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    command:
      - /usr/local/srs/objs/srs
      - -c
      - /usr/local/srs/conf/srs.conf
  #################################
  # MinIO对象存储
  #################################
  minio:
    image: minio/minio:RELEASE.2024-03-26T22-10-45Z
    container_name: minio
    restart: always
    networks:
      uav-net:
        ipv4_address: 172.19.0.20
    ports:
      - "5007:9000"
      - "5008:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /data/minio/data:/data
      - /data/minio/config:/root/.minio
    command:
      - server
      - /data
      - --console-address
      - ":9000"
      - --address
      - ":9001"
  #################################
  # EMQX MQTT
  #################################
  emqx:
    image: emqx/emqx:latest
    container_name: emqx
    restart: always
    networks:
      uav-net:
        ipv4_address: 172.19.0.30
    ports:
      - "5000:1883"
      - "5001:8083"
      - "5002:18083"
    environment:
      EMQX_NODE_NAME: emqx@172.19.0.30
    volumes:
      - /data/emqx:/opt/emqx/data
  #################################
  # MySQL
  #################################
  mysql:
    image: mysql:8
    container_name: mysql
    restart: always
    networks:
      uav-net:
        ipv4_address: 172.19.0.40
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: cloud_sample
    volumes:
      - /data/mysql:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
      - ./cloud_sample.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      --default-authentication-plugin=mysql_native_password
      --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      --explicit_defaults_for_timestamp=true
      --collation-server=utf8mb4_unicode_ci
      --character-set-server=utf8mb4
  #################################
  # Redis
  #################################
  redis:
    image: redis:6.2
    container_name: redis
    restart: always
    networks:
      uav-net:
        ipv4_address: 172.19.0.50
    ports:
      - "16380:6379"
    command:
      redis-server
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - /data/redis:/data
      - /etc/localtime:/etc/localtime:ro
  #################################
  # DJI Cloud API
  #################################
  cloud_api_sample:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloud-api-sample:1.10.0
    container_name: ${APP_NAME}
    hostname: ${APP_NAME}
    restart: always
    networks:
      uav-net:
        ipv4_address: 172.19.0.60
    depends_on:
      - mysql
      - redis
      - emqx
      - minio
      - srs
    logging:
      driver: json-file
      options:
        max-size: "5000m"
        max-file: "7"
    ports:
      - "5020:5020"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /data/cloud_api_sample/logs:/app/logs
    environment:
      TZ: Asia/Shanghai
      APP_NAME: ${APP_NAME}
      SERVER_PORT: 5020
      # mysql
      DB_URL: mysql:3306
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 1
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      CAPTCHA_EXPIRE: 120
      JWT_SECRET: ${JWT_SECRET}
      INIT_DATABASE_ADMIN: ${INIT_DATABASE_ADMIN}
      INIT_DATABASE_WORKSPACE: ${INIT_DATABASE_WORKSPACE}
      INIT_DATABASE_BIND_CODE: ${INIT_DATABASE_BIND_CODE}
      # MQTT
      MQTT_BASIC_HOST: ${HOST_IP}
      MQTT_BASIC_PORT: 5000
      MQTT_BASIC_USERNAME: ${MQTT_BASIC_USERNAME}
      MQTT_BASIC_PASSWORD: ${MQTT_BASIC_PASSWORD}
      MQTT_BASIC_CLIENT_ID: DJI-CLOUD-API-DEMO
      MQTT_DRC_HOST: ${HOST_IP}
      MQTT_DRC_PORT: 5001
      MQTT_DRC_USERNAME: ${MQTT_DRC_USERNAME}
      MQTT_DRC_PASSWORD: ${MQTT_DRC_PASSWORD}
      # EMQX API
      PROXY_EMQX_URL: http://emqx:18083
      PROXY_EMQX_USERNAME: ${EMQX_USERNAME}
      PROXY_EMQX_PASSWORD: ${EMQX_PASSWORD}
      # MinIO
      OSS_ENDPOINT: http://${HOST_IP}:5008
      OSS_ACCESS_KEY: ${MINIO_ROOT_USER}
      OSS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      OSS_BUCKET: cloud-bucket

      LOG_LEVEL: DEBUG
      CLOUD_API_APP_ID: ${CLOUD_API_APP_ID}
      CLOUD_API_APP_KEY: ${CLOUD_API_APP_KEY}
      LIVESTREAM_WHIP_URL: http://${HOST_IP}:5004/rtc/v1/whip/?app=live&stream=

      OIDC_ENABLED: true
  #################################
  # Nginx
  #################################
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    networks:
      uav-net:
        ipv4_address: 172.19.0.70
    ports:
      - "5019:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro